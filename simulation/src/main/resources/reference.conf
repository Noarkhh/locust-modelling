application {
  name = locust
}

clustering {
  ip = "0.0.0.0"
  port = 2551
  supervisor {
    ip = "0.0.0.0"
    port = 2551
  }
  min-nr-of-members = 1
}

xinuk {
  classes = [
    "pl.edu.agh.locust.model.AgentContainer",
    "pl.edu.agh.locust.model.SPPAgent",
    "pl.edu.agh.locust.algorithm.ParticleAgentMetrics",
    "pl.edu.agh.xinuk.simulation.GuiCellParticles",
    "breeze.linalg.DenseVector",
  ]
}

particle-agent {
  config {
    worldType = grid
    worldWidth = 12
    worldHeight = 12
    iterationsNumber = 100000
    iterationFinishedLogFrequency = 100
    skipEmptyLogs = false

    signalSuppressionFactor = 0.5
    signalAttenuationFactor = 1
    signalDisabled = true

    workersX = 1
    workersY = 12
    isSupervisor = true
    shardingMod = 144

    guiType = particles
    guiParticleSize = 2

    guiCellSize = 100
    guiStartIteration = 0
    guiUpdateFrequency = 1

    # Particle Agent config
    particleAgentFactory = NeuralFieldAgentFactory

    localOrderNeighbours = 5

    timestepDuration = 0.3

    agentContainerSize = 80
    agentAmount = 10000
    # initialAreaCenterX = 0.45
    # initialAreaCenterY = 0.45
    # initialAreaRadius = 0.45
    # initialAreaCenterX = 14.92
    # initialAreaCenterY = 38.4
    # initialAreaRadius = 14.92
    initialAreaCenterX = 150.0
    initialAreaCenterY = 500.0
    initialAreaRadius = 100.0

    averageSpeed = 5
    occlusionThreshold = 100

    hopProbability = 0.01
    crowdedHopProbability = 0.2
    hopDuration = 1.0
    hopSpeed = 0.1

    activityPeriod = 270.0
    minimalInactivityPeriod = 90.0
    resumeMarchProbabilityPerSecond = 0.01

    # SPP specific config
    previousDirectionWeight = 0.6
    randomComponentWeight = 0.05
    repulsionRange = 0.035
    alignmentRange = 0.135
    attractionRange = 0.3
    repulsionWeight = 1.5
    alignmentWeight = 3.0
    attractionWeight = 0.001

    # Ring Attractor specific config
    neuronsAmount = 100
    # spatialDiscretizationCoefficient = 5.0
    # spatialDiscretizationCoefficient = 6.3
    receptiveFieldStd = 0.4,
    synapticConnectivityCoefficient = 0.5
    inverseTemperatureCoefficient = 1000.0
    neuralInhibitionCoefficient = 0.0,
    totalSocialAttraction = 1.0
    # totalSocialAttraction = 0.24
    allocentricReferenceFrame = true

    # Spin System specific config
    neuralDynamicIterationsPerNeuronPerSecond = 50.0

    # Neural Field specific config
    antiGoalOverrideRange = 0.035,
    # antiGoalOverrideRange = 0.0,
    antiGoalStimulusStrength = -0.1
    # antiGoalStimulusStrength = 0.0
    
  }
}
